name: Release

# A v* tag is the release. blairham/.github's go-release.yml runs GoReleaser,
# which pushes ghcr.io/blairham/kafka-access-controller (amd64 and arm64) and
# a kactl archive per platform, signs checksums.txt with keyless cosign, and
# attests build provenance for the archives and the image. The notes are the
# tag's CHANGELOG.md section, and it refuses a tag the chart's appVersion
# does not name. The signing identity is go-release.yml itself; SECURITY.md
# shows how to verify it. The chart is published by chart.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the image on ghcr.io
      id-token: write # keyless cosign and provenance signing
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      test-command: make test
      images: '["ghcr.io/blairham/kafka-access-controller"]'
      charts: '["charts/kafka-access-controller"]'
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
