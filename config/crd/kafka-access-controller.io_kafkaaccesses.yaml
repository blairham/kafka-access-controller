---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kafkaaccesses.kafka-access-controller.io
spec:
  group: kafka-access-controller.io
  names:
    kind: KafkaAccess
    listKind: KafkaAccessList
    plural: kafkaaccesses
    shortNames:
    - ka
    singular: kafkaaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.principal
      name: Principal
      type: string
    - jsonPath: .spec.authorization
      name: Authz
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.pendingOperations
      name: Pending
      type: integer
    - jsonPath: .status.lastAppliedTime
      name: Applied
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KafkaAccess is the topics, ACLs and credentials one service needs on a Kafka
          cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KafkaAccessSpec declares the desired cluster state for one
              service.
            properties:
              authorization:
                default: acl
                description: |-
                  Authorization is acl (Kafka ACLs, the default) or iam (MSK IAM access
                  control).
                enum:
                - acl
                - iam
                type: string
              cluster:
                description: Cluster is the Kafka cluster to provision on.
                properties:
                  auth:
                    description: |-
                      Auth is how the controller authenticates. Unrelated to
                      spec.authorization, which concerns the service's principal.
                    properties:
                      method:
                        default: msk-iam
                        description: Method is msk-iam, scram-sha-512, scram-sha-256,
                          mtls, plain or none.
                        enum:
                        - msk-iam
                        - scram-sha-512
                        - scram-sha-256
                        - mtls
                        - plain
                        - none
                        type: string
                      region:
                        description: |-
                          Region is the AWS region the MSK IAM handshake is signed for. Required
                          for msk-iam.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef names the Secret, in this resource's namespace, holding the
                          admin credentials: keys username and password for scram and plain;
                          tls.crt and tls.key for mtls.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: cluster.auth.secretRef is required for scram, plain
                        and mtls
                      rule: '!has(self.method) || !(self.method in [''scram-sha-512'',''scram-sha-256'',''plain'',''mtls''])
                        || has(self.secretRef)'
                    - message: cluster.auth.region is required for msk-iam
                      rule: '!has(self.method) || self.method != ''msk-iam'' || (has(self.region)
                        && size(self.region) > 0)'
                  bootstrapServers:
                    description: BootstrapServers are host:port seeds for the admin
                      connection.
                    items:
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                  mskClusterARN:
                    description: |-
                      MSKClusterARN is the cluster's ARN. Required for authorization iam,
                      where the controller renders the IAM policy the service needs.
                    pattern: ^arn:aws[a-z-]*:kafka:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9-]+/[A-Za-z0-9-]+$
                    type: string
                  tls:
                    description: TLS configures transport security. Defaults to enabled.
                    properties:
                      caSecretRef:
                        description: |-
                          CASecretRef names a Secret whose ca.crt is trusted in addition to the
                          system roots, for a private CA. MSK's certificates chain to public
                          roots and need none.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      enabled:
                        default: true
                        description: Enabled turns TLS on. MSK's IAM, SCRAM and mTLS
                          listeners all require it.
                        type: boolean
                      serverName:
                        description: ServerName overrides the name verified on the
                          broker certificates.
                        type: string
                    type: object
                required:
                - bootstrapServers
                type: object
              consumerGroups:
                description: ConsumerGroups the service joins.
                items:
                  description: ConsumerGroup is one consumer group the service joins.
                  properties:
                    name:
                      description: |-
                        Name is the group id, or the prefix when patternType is Prefixed.
                        * and ? are refused: Kafka ACLs and IAM policies read them as wildcards.
                      minLength: 1
                      pattern: ^[^*?]+$
                      type: string
                    operations:
                      description: |-
                        Operations the principal is granted on the group. Read is what a
                        consumer needs to join and commit.
                      items:
                        description: Operation is a Kafka ACL operation.
                        enum:
                        - All
                        - Read
                        - Write
                        - Create
                        - Delete
                        - Alter
                        - Describe
                        - DescribeConfigs
                        - AlterConfigs
                        type: string
                      maxItems: 4
                      minItems: 1
                      type: array
                      x-kubernetes-validations:
                      - message: a consumer group takes only All, Read, Delete and
                          Describe
                        rule: self.all(op, op in ['All', 'Read', 'Delete', 'Describe'])
                    patternType:
                      default: Literal
                      description: PatternType is Literal (the default) or Prefixed.
                      enum:
                      - Literal
                      - Prefixed
                      type: string
                  required:
                  - name
                  - operations
                  type: object
                maxItems: 64
                type: array
              idempotentWrite:
                description: |-
                  IdempotentWrite grants IdempotentWrite on the cluster, which an
                  idempotent producer needs on brokers before Kafka 3.0.
                type: boolean
              mode:
                default: Enforce
                description: |-
                  Mode is Enforce (apply the plan) or Observe (report in status what would
                  change, and change nothing). Observe also never revokes on delete.
                enum:
                - Observe
                - Enforce
                type: string
              principal:
                description: |-
                  Principal is the Kafka principal granted to under authorization acl,
                  such as User:orders, or User:CN=orders for an mTLS client.
                pattern: ^[A-Za-z]+:.+$
                type: string
              revokeOnDelete:
                default: false
                description: |-
                  RevokeOnDelete deletes the ACLs this resource declares when it is
                  deleted. Topics and credentials are never deleted.
                type: boolean
              scramCredential:
                description: |-
                  SCRAMCredential provisions the principal's SCRAM password on a
                  self-managed cluster. The user is never deleted.
                properties:
                  mechanism:
                    default: SCRAM-SHA-512
                    description: Mechanism is SCRAM-SHA-512 (the default) or SCRAM-SHA-256.
                    enum:
                    - SCRAM-SHA-512
                    - SCRAM-SHA-256
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef names the Secret, in this resource's namespace, whose
                      password key is the service's password.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - passwordSecretRef
                type: object
              topics:
                description: Topics the service uses.
                items:
                  description: Topic is one topic the service uses.
                  properties:
                    config:
                      additionalProperties:
                        type: string
                      description: |-
                        Config holds topic configs to set on a managed topic, such as
                        retention.ms. Keys not listed are left alone.
                      maxProperties: 64
                      type: object
                    manage:
                      description: |-
                        Manage makes the controller create the topic if it is missing, grow its
                        partitions and set the configs listed here. Without it the topic is
                        only granted on. A managed topic is never deleted.
                      type: boolean
                    name:
                      description: Name is the topic name, or the prefix when patternType
                        is Prefixed.
                      maxLength: 249
                      minLength: 1
                      pattern: ^[a-zA-Z0-9._-]+$
                      type: string
                    operations:
                      description: |-
                        Operations the principal is granted on the topic, under authorization
                        acl, or the matching IAM actions under iam.
                      items:
                        description: Operation is a Kafka ACL operation.
                        enum:
                        - All
                        - Read
                        - Write
                        - Create
                        - Delete
                        - Alter
                        - Describe
                        - DescribeConfigs
                        - AlterConfigs
                        type: string
                      maxItems: 9
                      type: array
                    partitions:
                      description: |-
                        Partitions is the partition count of a managed topic. Kafka can only
                        add partitions, so a smaller value than the topic has is reported, not
                        applied.
                      format: int32
                      minimum: 1
                      type: integer
                    patternType:
                      default: Literal
                      description: |-
                        PatternType is Literal (the default) or Prefixed. It applies to the
                        ACLs; only a Literal topic can be managed.
                      enum:
                      - Literal
                      - Prefixed
                      type: string
                    replicationFactor:
                      description: |-
                        ReplicationFactor is used when a managed topic is created. Unset uses
                        the broker default. A change to an existing topic is reported, not
                        applied: it needs a partition reassignment.
                      minimum: 1
                      type: integer
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a Prefixed topic cannot be managed; manage one topic
                      at a time
                    rule: '!has(self.manage) || !self.manage || !has(self.patternType)
                      || self.patternType == ''Literal'''
                  - message: a managed topic needs partitions
                    rule: '!has(self.manage) || !self.manage || has(self.partitions)'
                maxItems: 256
                type: array
              transactionalIDs:
                description: TransactionalIDs the service produces with.
                items:
                  description: TransactionalID is a transactional.id the service produces
                    with.
                  properties:
                    name:
                      description: |-
                        Name is the transactional id, or the prefix when patternType is
                        Prefixed. * and ? are refused: Kafka ACLs and IAM policies read them as
                        wildcards.
                      minLength: 1
                      pattern: ^[^*?]+$
                      type: string
                    operations:
                      description: |-
                        Operations the principal is granted. A transactional producer needs
                        Write and Describe.
                      items:
                        description: Operation is a Kafka ACL operation.
                        enum:
                        - All
                        - Read
                        - Write
                        - Create
                        - Delete
                        - Alter
                        - Describe
                        - DescribeConfigs
                        - AlterConfigs
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-validations:
                      - message: a transactional id takes only All, Write and Describe
                        rule: self.all(op, op in ['All', 'Write', 'Describe'])
                    patternType:
                      default: Literal
                      description: PatternType is Literal (the default) or Prefixed.
                      enum:
                      - Literal
                      - Prefixed
                      type: string
                  required:
                  - name
                  - operations
                  type: object
                maxItems: 64
                type: array
            required:
            - cluster
            type: object
            x-kubernetes-validations:
            - message: principal is required for authorization acl
              rule: '!has(self.authorization) || self.authorization != ''acl'' ||
                (has(self.principal) && size(self.principal) > 0)'
            - message: cluster.mskClusterARN is required for authorization iam
              rule: '!has(self.authorization) || self.authorization != ''iam'' ||
                (has(self.cluster.mskClusterARN) && size(self.cluster.mskClusterARN)
                > 0)'
            - message: scramCredential does not apply under authorization iam
              rule: '!has(self.authorization) || self.authorization != ''iam'' ||
                !has(self.scramCredential)'
          status:
            description: KafkaAccessStatus reports what the controller actually applied.
            properties:
              appliedPlanHash:
                description: |-
                  AppliedPlanHash fingerprints the operations applied on the last
                  successful reconcile.
                type: string
              conditions:
                description: |-
                  Conditions are Ready (the last reconcile planned, and in Enforce applied,
                  without a fatal error) and Converged (the cluster already matches the
                  spec).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              iamPolicy:
                description: |-
                  IAMPolicy is the IAM policy document the service's role needs, under
                  authorization iam. The controller does not attach it.
                type: string
              lastAppliedTime:
                description: LastAppliedTime is when that plan was applied.
                format: date-time
                type: string
              lastPlannedTime:
                description: |-
                  LastPlannedTime is when the cluster was last planned against, in either
                  mode.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  describes.
                format: int64
                type: integer
              operationsApplied:
                description: OperationsApplied counts the operations in the last applied
                  plan.
                type: integer
              ownedACLs:
                description: |-
                  OwnedACLs is the inventory of ACLs this resource has declared, as
                  ownership keys. An ACL in it that the spec no longer declares is
                  deleted; an ACL not in it is never touched.
                items:
                  type: string
                type: array
              pending:
                description: Pending lists those operations, capped at the first 50.
                items:
                  type: string
                type: array
              pendingOperations:
                description: |-
                  PendingOperations counts the operations the cluster still needs to
                  match the spec. In Enforce it comes from a re-plan after applying.
                type: integer
              scramSecretVersion:
                description: |-
                  SCRAMSecretVersion is the resourceVersion of the password Secret last
                  written to the cluster. Kafka cannot report a password, so a Secret
                  whose resourceVersion differs is what triggers a rotation.
                type: string
              warnings:
                description: |-
                  Warnings holds the best-effort operations that failed on the last
                  apply, such as a partition decrease Kafka cannot make.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
